[package]
name = "slate-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol (MCP) server for Slate video editor"

[dependencies]
slate-core = { path = "../slate-core" }
slate-ipc = { path = "../slate-ipc" }
slate-media = { path = "../slate-media" }
slate-render = { path = "../slate-render" }
slate-analysis = { path = "../slate-analysis" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4"
