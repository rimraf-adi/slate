[package]
name = "slate-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
slate-core = { workspace = true }
slate-media = { path = "../slate-media" }
slate-audio = { path = "../slate-audio" }
slate-render = { path = "../slate-render" }
slate-analysis = { path = "../slate-analysis" }
slate-ipc = { path = "../slate-ipc" }

egui = "0.30"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
wgpu = { version = "23.0", features = ["fragile-send-sync-non-atomic-wasm"] }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
