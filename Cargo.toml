[workspace]
resolver = "2"
members = [
    "crates/slate-core",
    "crates/slate-media",
    "crates/slate-audio",
    "crates/slate-render",
    "crates/slate-cli",
    "crates/slate-ipc",
    "crates/slate-analysis",
    "crates/slate-mcp",
    "crates/slate-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aditya Kinjawadekar <aditya@100xcode.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/100xcode/slate"
rust-version = "1.80.0"

[workspace.dependencies]
# Internal workspace crates
slate-core = { path = "crates/slate-core" }

# Serialization & Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["uuid1"] }
bincode = "1.3"

# Identifiers & Math
uuid = { version = "1.10", features = ["v4", "serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# Error Handling & Diagnostics
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utility
crc32fast = "1.4"
pathdiff = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Testing & QA
proptest = "1.5"
insta = { version = "1.40", features = ["json"] }
tempfile = "3.12"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false
debug = 1
